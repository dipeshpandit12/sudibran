[project]
name = "sudibran-backend"
version = "0.1.0"
description = "Sudibran gate: the security layer between an AI agent and the money"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "anthropic>=0.60",
  "mcp>=1.9",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "droid-sdk>=0.5,<0.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# BLE001: the broad `except Exception` blocks are the fail-closed paths (OPA, parser, CRS,
# planner, signature checks): any error there must deny or hold, whatever its type.
ignore = ["BLE001"]
