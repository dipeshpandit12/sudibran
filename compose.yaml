name: sudibran

include:
  - path: ./backend/docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SUDIBRAN_BACKEND_URL: http://gate:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SUDIBRAN_BACKEND_URL: http://gate:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      gate:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - public

